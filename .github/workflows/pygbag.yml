name: pygbag_build

on:
  push:
    paths:
      - '**.py'
      - 'levels/**'
      - 'pygbag.ini'
      - '.github/workflows/pygbag.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pygbag:
    name: Build for Emscripten pygbag runtime
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]'))

    steps:
    - uses: actions/checkout@v2
    - name: Checkout
      run: |
            python -m pip install pygbag
            python -m pygbag --build .

    - name : "Upload to GitHub pages branch gh-pages"
      uses: JamesIves/github-pages-deploy-action@4.1.7
      with:
        branch: gh-pages
        folder: build/web

    - name: Publish to itch.io via Butler
      uses: manleydev/butler-publish-itchio-action@v1.0.3
      env:
        BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      with:
        channel: 'html'
        itch_user: 'shivamkr12'
        itch_game: 'arkanoid'
        package: 'build/web'
        version: v${{ github.run_number }}
